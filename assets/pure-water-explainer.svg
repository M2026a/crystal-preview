<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="title desc">
<title id="title">洗車の水の違い</title><desc id="desc">水道水は乾くとミネラルが残ることがあり、純水はミネラル分を取り除いて水ジミの原因を残しにくくします。</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#edf4f6"/><stop offset="1" stop-color="#dce9ed"/></linearGradient><linearGradient id="drop" x2="0" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#82bbcf"/></linearGradient><filter id="shadow" x="-.2" y="-.2" width="1.4" height="1.5"><feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#173743" flood-opacity=".1"/></filter></defs>
<rect width="900" height="500" rx="18" fill="url(#bg)"/><text x="450" y="53" text-anchor="middle" font-family="sans-serif" font-size="20" letter-spacing="3" fill="#507484">THE WATER MAKES A DIFFERENCE</text>
<g filter="url(#shadow)"><rect x="34" y="82" width="398" height="360" rx="14" fill="#fff"/><rect x="468" y="82" width="398" height="360" rx="14" fill="#fff"/></g>
<text x="233" y="124" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="700" fill="#233d48">水道水</text><text x="667" y="124" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="700" fill="#233d48">Crystalの純水</text>
<path d="M232 155 C232 155 177 225 177 256a55 55 0 0 0 110 0c0-31-55-101-55-101Z" fill="url(#drop)" stroke="#5b9eb5" stroke-width="3"/><circle cx="208" cy="248" r="8" fill="#d3a44e"/><circle cx="244" cy="271" r="7" fill="#d3a44e"/><circle cx="262" cy="235" r="6" fill="#d3a44e"/><text x="232" y="333" text-anchor="middle" font-family="sans-serif" font-size="26" fill="#566b74">ミネラルを含む</text>
<path d="M666 155 C666 155 611 225 611 256a55 55 0 0 0 110 0c0-31-55-101-55-101Z" fill="url(#drop)" stroke="#5b9eb5" stroke-width="3"/><path d="M624 258h84" stroke="#fff" stroke-width="3" opacity=".8"/><text x="666" y="333" text-anchor="middle" font-family="sans-serif" font-size="26" fill="#566b74">ミネラル分を除去</text>
<path d="M232 358v28" stroke="#8297a0" stroke-width="2" stroke-dasharray="4 5"/><path d="M666 358v28" stroke="#8297a0" stroke-width="2" stroke-dasharray="4 5"/><rect x="118" y="390" width="228" height="12" rx="6" fill="#d8e2e5"/><rect x="552" y="390" width="228" height="12" rx="6" fill="#d8e2e5"/><circle cx="172" cy="386" r="7" fill="#d3a44e"/><circle cx="199" cy="386" r="7" fill="#d3a44e"/><circle cx="224" cy="386" r="7" fill="#d3a44e"/>
<text x="232" y="427" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="700" fill="#725b2f">乾くと成分が残ることも</text><text x="666" y="427" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="700" fill="#275b6c">水ジミの原因を残しにくい</text>
</svg>